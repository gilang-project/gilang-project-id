<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Katalog Produk Affiliate</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            accent: '#FF4757',
                            dark: '#0F0F0F',
                            card: '#181818'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-brand-dark text-white min-h-screen pb-10">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-30 bg-brand-dark/95 backdrop-blur-md border-b border-white/10 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-lg font-bold text-brand-accent flex items-center gap-2">
                <i class="fa-solid fa-bag-shopping"></i> Katalog
            </h1>
            <div class="relative w-1/2">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Cari produk..." 
                       class="w-full bg-white/5 text-xs text-white rounded-full px-3 py-2 pl-8 border border-white/10 focus:outline-none focus:border-brand-accent">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-xs text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- Section Profil & Banner Shopee Affiliate -->
    <section class="max-w-md mx-auto px-4 mt-4">
        <!-- Header Profil -->
        <div class="flex items-center justify-between bg-brand-card p-3 rounded-2xl border border-white/10 mb-3">
            <div class="flex items-center gap-3">
                <!-- ID logo diperjelas agar mudah diubah oleh script -->
                <img id="storeLogoImg" src="https://via.placeholder.com/40" alt="Logo" class="w-10 h-10 rounded-full object-cover border border-white/20">
                <div>
                    <!-- ID nama toko diperjelas -->
                    <h2 id="storeNameText" class="text-xs font-bold text-white flex items-center gap-1">
                        Memuat Toko... <i class="fa-solid fa-circle-check text-blue-500 text-[10px]"></i>
                    </h2>
                    <p class="text-[10px] text-gray-400">Rekomendasi Produk & Affiliate</p>
                </div>
            </div>
            <button onclick="shareCatalog()" class="bg-white/10 hover:bg-white/20 text-white text-[10px] font-semibold px-3 py-1.5 rounded-full border border-white/10 flex items-center gap-1 transition">
                <i class="fa-solid fa-share-nodes"></i> Bagikan
            </button>
        </div>

        <!-- Banner Promo -->
        <div class="bg-gradient-to-r from-orange-600 to-red-600 p-3.5 rounded-2xl mb-4 border border-white/10 shadow-lg flex items-center gap-3">
            <div class="bg-black/20 w-8 h-8 rounded-xl flex items-center justify-center shrink-0">
                <i class="fa-solid fa-bolt text-yellow-300"></i>
            </div>
            <div>
                <p class="text-[9px] font-extrabold uppercase tracking-widest text-yellow-300">SHOPEE AFFILIATE CHOICE</p>
                <h3 class="text-xs font-bold text-white">Katalog Produk Pilihan & Diskon Terbaik</h3>
            </div>
        </div>

        <!-- Tombol Filter Kategori -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
            <button onclick="filterCategory('all')" id="btn-all" class="bg-brand-accent text-white text-xs font-bold px-4 py-2 rounded-xl shrink-0 transition">Semua</button>
            <button onclick="filterCategory('fashion')" id="btn-fashion" class="bg-brand-card hover:bg-white/10 text-gray-300 text-xs font-medium px-4 py-2 rounded-xl border border-white/10 shrink-0 transition">Fashion</button>
            <button onclick="filterCategory('otomotif')" id="btn-otomotif" class="bg-brand-card hover:bg-white/10 text-gray-300 text-xs font-medium px-4 py-2 rounded-xl border border-white/10 shrink-0 transition">Otomotif</button>
            <button onclick="filterCategory('perawatan')" id="btn-perawatan" class="bg-brand-card hover:bg-white/10 text-gray-300 text-xs font-medium px-4 py-2 rounded-xl border border-white/10 shrink-0 transition">Perawatan</button>
            <button onclick="filterCategory('elektronik')" id="btn-elektronik" class="bg-brand-card hover:bg-white/10 text-gray-300 text-xs font-medium px-4 py-2 rounded-xl border border-white/10 shrink-0 transition">Elektronik</button>
        </div>
    </section>

    <!-- Grid Produk -->
    <main class="max-w-md mx-auto px-4 mt-4">
        <div id="productGrid" class="grid grid-cols-2 gap-3">
            <!-- Loader -->
            <div class="col-span-2 text-center py-10 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p class="text-xs">Memuat katalog produk...</p>
            </div>
        </div>
    </main>

    <!-- Modal Detail Produk -->
    <div id="productModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-brand-card w-full max-w-sm rounded-2xl overflow-hidden border border-white/10 shadow-2xl relative flex flex-col max-h-[90vh]">
            
            <div class="relative w-full bg-black shrink-0">
                <div class="relative h-72 w-full">
                    <img id="modalImg" src="" alt="Product Image" class="w-full h-full object-cover transition-all duration-200">
                    <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/60 hover:bg-black/80 w-9 h-9 rounded-full flex items-center justify-center text-white backdrop-blur-md border border-white/20 transition z-10">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                    <div class="absolute bottom-3 left-3 flex gap-1.5 z-10">
                        <span id="modalBadge" class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-lg bg-brand-accent text-white shadow-md">MALL</span>
                        <span id="modalCommission" class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-lg bg-orange-500/90 text-white shadow-md">KOMISI S.D 10%</span>
                    </div>
                </div>
                <div id="modalThumbs" class="flex gap-2 p-2 bg-[#101010] overflow-x-auto hide-scrollbar border-b border-white/10"></div>
            </div>

            <div class="p-4 overflow-y-auto space-y-3">
                <div class="flex items-center justify-between">
                    <span id="modalCategory" class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold bg-white/5 px-2 py-0.5 rounded">Category</span>
                    <div class="flex items-center gap-2 text-xs text-gray-300">
                        <span><i class="fa-solid fa-star text-amber-400"></i> <span id="modalRating">4.9</span></span>
                        <span>•</span>
                        <span id="modalSold">Terjual 10RB+</span>
                    </div>
                </div>

                <h2 id="modalTitle" class="text-base font-bold text-white leading-snug">Nama Produk</h2>
                <div id="modalPrice" class="text-xl font-extrabold text-brand-accent">Rp0</div>

                <div class="border-t border-white/10 pt-3">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase mb-1">Deskripsi Produk</h3>
                    <p id="modalDesc" class="text-xs text-gray-300 whitespace-pre-line leading-relaxed">Deskripsi produk...</p>
                </div>
            </div>

            <div class="p-4 bg-brand-card border-t border-white/10 shrink-0">
                <button id="modalActionBtn" class="w-full bg-brand-accent hover:bg-red-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-brand-accent/20">
                    <span>Beli Sekarang di Shopee</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- Script Utama JavaScript -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCFa4G2bnhvFT-jbEZfgz8kasX_5Qkkdp8",
            authDomain: "projectid-802fe.firebaseapp.com",
            databaseURL: "https://projectid-802fe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "projectid-802fe",
            storageBucket: "projectid-802fe.firebasestorage.app",
            messagingSenderId: "776316465072",
            appId: "1:776316465072:web:ZGE2NDI4ZDKtZDY3MC0nWE2LTg1NTQtMTg0MTRmMmE1NTMy"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let products = [];
        let selectedProduct = null;
        let currentCategory = 'all';

        // 1. Ambil Pengaturan Toko dari Firestore (koleksi: settings, dokumen: store)
        db.collection("settings").doc("store").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                // Update Nama Toko
                if (data.name) {
                    document.getElementById('storeNameText').innerHTML = `${data.name} <i class="fa-solid fa-circle-check text-blue-500 text-[10px]"></i>`;
                    document.getElementById('pageTitle').innerText = data.name;
                }
                // Update Logo Toko (bisa berupa URL atau Base64 dari upload file admin)
                if (data.logo) {
                    document.getElementById('storeLogoImg').src = data.logo;
                }
            } else {
                console.warn("Dokumen settings/store belum ada di Firestore. Silakan simpan pengaturan dari Admin Panel terlebih dahulu.");
            }
        }, (error) => {
            console.error("Gagal memuat pengaturan toko:", error);
        });

        // 2. Ambil Data Produk dari Firestore
        db.collection("products").onSnapshot((snapshot) => {
            products = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                
                const imgs = (Array.isArray(data.imageUrls) && data.imageUrls.length > 0) 
                    ? data.imageUrls 
                    : [data.imageUrl || data.image || "https://images.unsplash.com/photo-1517445312882-bc9910d016b7?w=600&auto=format&fit=crop"];

                products.push({
                    id: doc.id,
                    title: data.title || "Tanpa Judul",
                    price: Number(data.price) || 0,
                    rating: data.rating || 4.9,
                    sold: data.sold || "10RB+",
                    category: (data.category || "fashion").toLowerCase(),
                    commission: data.commission || "Komisi s.d 10%",
                    badge: data.badge || "MALL",
                    images: imgs,
                    image: imgs[0],
                    desc: data.desc || "Deskripsi produk belum tersedia.",
                    link_shopee: data.link || data.link_shopee || "#"
                });
            });
            filterCategory(currentCategory);
        }, (error) => {
            console.error("Gagal mengambil data dari Firebase:", error);
        });

        // Render Produk ke Grid
        function renderProducts(items) {
            const container = document.getElementById('productGrid');
            if (!container) return;

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="col-span-2 text-center py-10 text-gray-400">
                        <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                        <p class="text-xs">Tidak ada produk ditemukan.</p>
                    </div>`;
                return;
            }

            container.innerHTML = items.map((p) => `
                <div onclick="openModal('${p.id}')" class="bg-brand-card rounded-xl overflow-hidden border border-white/5 hover:border-brand-accent/50 transition cursor-pointer flex flex-col justify-between">
                    <div>
                        <div class="relative h-40 w-full overflow-hidden bg-black/40">
                            <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover">
                            <div class="absolute top-2 left-2">
                                <span class="text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-brand-accent text-white">
                                    ${p.badge}
                                </span>
                            </div>
                        </div>
                        <div class="p-2.5">
                            <h3 class="text-xs font-semibold text-white line-clamp-2 mb-1">${p.title}</h3>
                            <div class="text-sm font-bold text-brand-accent">Rp${p.price.toLocaleString('id-ID')}</div>
                        </div>
                    </div>
                    <div class="px-2.5 pb-2.5 flex items-center justify-between text-[10px] text-gray-400 border-t border-white/5 pt-2">
                        <span><i class="fa-solid fa-star text-amber-400"></i> ${p.rating}</span>
                        <span>Terjual ${p.sold}</span>
                    </div>
                </div>
            `).join('');
        }

        // Buka Modal Detail Produk
        function openModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            selectedProduct = product;
            
            document.getElementById('modalImg').src = product.image;
            
            const thumbsContainer = document.getElementById('modalThumbs');
            thumbsContainer.innerHTML = '';

            if (Array.isArray(product.images) && product.images.length > 1) {
                thumbsContainer.classList.remove('hidden');
                product.images.forEach((imgUrl, idx) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgUrl;
                    thumb.className = `w-12 h-12 object-cover rounded-lg border-2 cursor-pointer shrink-0 transition ${idx === 0 ? 'border-brand-accent opacity-100' : 'border-transparent opacity-60 hover:opacity-100'}`;
                    
                    thumb.onclick = () => {
                        document.getElementById('modalImg').src = imgUrl;
                        Array.from(thumbsContainer.children).forEach(child => {
                            child.classList.remove('border-brand-accent', 'opacity-100');
                            child.classList.add('border-transparent', 'opacity-60');
                        });
                        thumb.classList.remove('border-transparent', 'opacity-60');
                        thumb.classList.add('border-brand-accent', 'opacity-100');
                    };
                    thumbsContainer.appendChild(thumb);
                });
            } else {
                thumbsContainer.classList.add('hidden');
            }

            document.getElementById('modalTitle').innerText = product.title;
            document.getElementById('modalPrice').innerText = 'Rp' + product.price.toLocaleString('id-ID');
            document.getElementById('modalDesc').innerText = product.desc;
            document.getElementById('modalBadge').innerText = product.badge;
            document.getElementById('modalCommission').innerText = product.commission;
            document.getElementById('modalCategory').innerText = product.category;
            document.getElementById('modalSold').innerText = 'Terjual ' + product.sold;
            document.getElementById('modalRating').innerText = product.rating;
            
            const actionBtn = document.getElementById('modalActionBtn');
            actionBtn.onclick = () => window.open(product.link_shopee, '_blank');

            document.getElementById('productModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Tutup Modal
        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Filter Pencarian Text
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = products;
            
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }

            if (query) {
                filtered = filtered.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            }
            renderProducts(filtered);
        }

        // Filter Kategori Tombol
        function filterCategory(cat) {
            currentCategory = cat;
            
            ['all', 'fashion', 'otomotif', 'perawatan', 'elektronik'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if (btn) {
                    if (c === cat) {
                        btn.className = "bg-brand-accent text-white text-xs font-bold px-4 py-2 rounded-xl shrink-0 transition";
                    } else {
                        btn.className = "bg-brand-card hover:bg-white/10 text-gray-300 text-xs font-medium px-4 py-2 rounded-xl border border-white/10 shrink-0 transition";
                    }
                }
            });

            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = products;

            if (cat !== 'all') {
                filtered = filtered.filter(p => p.category === cat);
            }

            if (query) {
                filtered = filtered.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            }

            renderProducts(filtered);
        }

        // Tombol Bagikan Katalog
        function shareCatalog() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: 'Cek katalog rekomendasi produk pilihan terbaik di sini!',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Link katalog berhasil disalin ke clipboard!");
            }
        }
    </script>
</body>
</html>
